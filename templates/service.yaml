apiVersion: v1
kind: Service
metadata:
      name: {{ .Values.app.name}}-{{ .Values.app.instance}}-service
spec:
    type: ClusterIP
    ports:
    - name: http
      port: {{ .Values.service.port}}
      targetPort: http
    selector:
      app.kubernetes.io/name: {{ .Values.app.name}}
      app.kubernetes.io/instance: {{ .Values.app.instance}}
